# ==========================================
# PERFIL PADRÃO (DESENVOLVIMENTO - H2)
# ==========================================
spring:
  application:
    name: finc2u-app
  datasource:
    url: jdbc:h2:file:./data/finc2udb;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Estatísticas do Hibernate (só em dev): com o logger abaixo, cada sessão fechada loga o total de
        # statements JDBC da requisição — o jeito mais rápido de enxergar um N+1 (skill n1-problem-spring).
        generate_statistics: true
logging:
  level:
    org.hibernate.session.metrics: DEBUG
# Definidos explicitamente (mesmo em dev) para o SpringDoc não avisar que os endpoints estão ativos por padrão.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
app:
  seeders:
    enabled: true


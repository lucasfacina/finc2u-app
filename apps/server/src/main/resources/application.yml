# ==========================================
# PERFIL PADRÃO (DESENVOLVIMENTO - H2)
# ==========================================
spring:
  application:
    name: finc2u-app
  datasource:
    url: jdbc:h2:file:./data/finc2udb;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  seeders:
    enabled: true


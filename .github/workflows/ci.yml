name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Semanal: vulnerabilidades novas aparecem mesmo sem mudança no código.
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Testes e build (Java 21)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes, build e verificações
        run: ./mvnw -B -ntp verify

  audit:
    name: Auditoria de dependências (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Auditar dependências Maven na base OSV
        run: ./scripts/deps-audit.sh
